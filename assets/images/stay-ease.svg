  <rect x="60" y="352" width="85" height="38" rx="6" fill="#003087"/>
  <text x="80" y="375" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">PayPal</text>
  
  <rect x="155" y="352" width="90" height="38" rx="6" fill="#4c1d95"/>
  <text x="172" y="375" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">InstaPay</text>

  <rect x="255" y="352" width="85" height="38" rx="6" fill="#065f46"/>
  <text x="277" y="375" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">VCash</text>

  <rect x="350" y="352" width="110" height="38" rx="6" fill="#334155"/>
  <text x="362" y="375" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Cash at Hotel</text>

  <!-- Right Side: Architecture & Dina's Lead Role -->
  <rect x="510" y="95" width="260" height="325" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="530" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">System Architecture</text>
  <line x1="530" y1="138" x2="750" y2="138" stroke="rgba(255,255,255,0.1)"/>

  <text x="530" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x2713; Relational ERD Design</text>
  <text x="545" y="183" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hotels &#x2194; Rooms &#x2194; Bookings (1:N)</text>
  <text x="545" y="199" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Guests &#x2194; Reviews (N:M)</text>

  <text x="530" y="230" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x2713; ASP.NET Core MVC Backend</text>
  <text x="545" y="248" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Authentication &amp; User Sessions</text>
  <text x="545" y="264" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dynamic Filtering &amp; Search API</text>

  <text x="530" y="295" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x2713; Admin Back-Office Module</text>
  <text x="545" y="313" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Room availability, rates &amp; orders</text>

  <rect x="525" y="335" width="230" height="70" rx="8" fill="rgba(59,130,246,0.1)" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="538" y="357" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x2605; Team Leader Responsibilities</text>
  <text x="538" y="375" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Task distribution, daily follow-up,</text>
  <text x="538" y="392" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">code integration &amp; presentation.</text>
</svg>