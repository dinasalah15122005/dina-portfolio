  <text x="692" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Search</text>

  <!-- Left Card: Selected Hotel & Room Booking -->
  <rect x="30" y="95" width="460" height="325" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Hotel Image / Mock Graphic -->
  <rect x="45" y="110" width="430" height="120" rx="8" fill="#1e293b"/>
  <rect x="55" y="120" width="130" height="100" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28">&#x1F3E8;</text>
  <text x="200" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="bold">The Nile Grand Palace Hotel</text>
  <text x="200" y="168" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13">&#x2605;&#x2605;&#x2605;&#x2605;&#x2605; (4.8 / 5.0 &#x2022; 320 reviews)</text>
  <text x="200" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Corniche El Nile, Downtown Cairo</text>
  <text x="200" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">&#x2713; Free Cancellation &#x2022; Pool &#x2022; Wi-Fi</text>

