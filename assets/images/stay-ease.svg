  <rect x="45" y="242" width="430" height="65" rx="8" fill="rgba(30,41,59,0.5)" stroke="rgba(255,255,255,0.05)"/>
  <text x="60" y="267" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Executive Deluxe Suite (King Bed)</text>
  <text x="60" y="290" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">2 Adults &#x2022; River View &#x2022; Breakfast Included</text>
  <text x="315" y="272" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">$160 / night</text>
