<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hotelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="60%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#hotelBg)"/>

  <!-- Top Search & Filter Bar -->
  <rect x="30" y="20" width="740" height="56" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(59,130,246,0.3)" stroke-width="1.2"/>
  <text x="50" y="53" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">STAY EASE</text>
  
  <!-- Search input pills -->
  <rect x="170" y="30" width="130" height="34" rx="6" fill="#1e293b"/>
  <text x="182" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">City: Cairo / Luxor</text>
  
  <rect x="310" y="30" width="125" height="34" rx="6" fill="#1e293b"/>
  <text x="322" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dates: Oct 15 - 20</text>
  
  <rect x="445" y="30" width="120" height="34" rx="6" fill="#1e293b"/>
  <text x="457" y="52" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">&#x2605; 5 Stars Hotel</text>

  <rect x="580" y="30" width="80" height="34" rx="6" fill="#1e293b"/>
  <text x="592" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Max $250</text>

